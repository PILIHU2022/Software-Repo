name: Gadgetbridge

# Gadgetbridge is built by its own pipeline: a push only starts it when it touches
# apps/gadgetbridge/, a daily cron builds only after the app's 10-day window and an
# upstream move, and a manual dispatch always builds. The pipeline itself
# (watch, build, publish, record, notifications) lives in app-build.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/gadgetbridge/**'
      - '.github/workflows/gadgetbridge.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: gadgetbridge-build
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/app-build.yml
    with:
      app: gadgetbridge

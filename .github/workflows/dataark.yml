name: DataArk build

# ⚠️ DORMANT BY DESIGN — this workflow never triggers.
#
# DataArk (dataark/) is a standalone GPL-3.0 Android app (package
# dev.dataark.backup) that backs up other apps' private data via Root /
# Shizuku / Dhizuku. The build below is complete and correct, but every
# trigger is deliberately neutered so it cannot consume runner minutes until
# someone consciously re-enables it:
#
#   1. push:    restricted to branch `dormant/dataark`, which must never be
#               created. A push to main does not match.
#   2. schedule: cron '0 0 30 2 *' targets February 30th, a date that does
#               not exist. GitHub validates the syntax but the day never
#               arrives, so the scheduler never fires it.
#   3. jobs.build has `if: false` — even if a trigger above somehow fired
#               (or someone re-adds workflow_dispatch), every job is skipped.
#
# There is no workflow_dispatch on purpose: nothing can start this workflow,
# manually or automatically.
#
# To enable it: change the `on:` block (e.g. add `workflow_dispatch:` or a
# real `push` path filter for `dataark/**`) and delete the `if: false` line.

on:
  push:
    branches:
      - 'dormant/dataark'
  schedule:
    # February 30th — never occurs, so this never runs.
    - cron: '0 0 30 2 *'

permissions:
  contents: read

concurrency:
  group: dataark-build
  cancel-in-progress: true

jobs:
  build:
    name: Assemble DataArk APKs
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dataark
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug and release APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DataArk-debug
          path: dataark/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DataArk-release
          path: dataark/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: BaiduNetGo build

# Watches github.com/pengstem/baidunetgo and rebuilds the patched app when its
# main branch moves. BaiduNetGo has two halves built from the same patch queue
# (desktop/baidunetgo/patches): the Go/MyGo desktop client (x86 installers,
# GitHub Releases, the desktop update feed) and the Android client in the
# queue's android/ directory (a signed APK published to the F-Droid repo, a
# tagged Release and its own update feed fdroid/baidunetgo/update.json).
#
# A successful desktop build also publishes the installers to a Release tagged
# `baidunetgo-desktop-<version>-<short_sha>` (an explicit tag, never marked
# `latest`: the repository may point `latest` at something else later) and
# commits desktop/baidunetgo/update.json, the update feed the patched app
# reads from Settings → Updates. The feed URL is compiled into the binary
# (PATCHWORK_FEED_URL -> internal/updates.defaultFeed), so a released build
# checks for its own updates with no configuration. The feed covers the two
# x86 platforms only; the workflow artifact (90 days) is kept as the quick
# grab, since a Release download is one click more.
#
# On Linux the build also packages the release for Arch Linux: an
# archlinux:base-devel container runs makepkg on the inputs mygo wrote next to
# the build, and the resulting baidunetgo-<version>-1-x86_64.pkg.tar.zst
# (`sudo pacman -U <file>`) is uploaded to the same Release as an extra asset.
# The feed keeps pointing linux downloads at the .tar.gz; the Arch package is a
# convenience for pacman users, not a third feed platform. If makepkg fails,
# the build fails without publishing.
#
# Cadence: every 10 days. GitHub crons cannot express "every 10 days" (a
# `*/10` day-of-month rule fires on the 1st, 11th, 21st and 31st), so the
# workflow runs daily and the check job returns early unless
# .watch-state.json's `baidunetgo` timestamp is 10 days old. A scheduled run that
# finishes (even with a fallback build) advances that timestamp; only a hard
# failure leaves it in place, so the next daily run retries.
#
# Trigger shape matches the Android app pipelines: a push touching
# desktop/baidunetgo/** (or this workflow file) builds immediately, a daily
# schedule builds only after the 10-day window and an upstream move, and a
# manual dispatch always builds. A successful push/dispatch build also advances
# the 10-day timestamp, so the next automatic build is at least 10 days later.
#
# The queue in desktop/baidunetgo/patches is replayed onto the upstream head
# with `git am -3` (the exported-commit form of rebasing the authoring branch).
# When it no longer applies, the build retries once on the last successful
# upstream commit recorded in desktop/.build-state.json.
#
# x86 only: linux/amd64 and windows/amd64, cross-built on the x86 runner.
#
# The Android job builds the same patched tree's android/ project (Gradle:
# :core JVM + :app Compose) with the SDK/JDK setup app-build.yml uses, signs the
# APK with the patchwork keystore (scripts/build-baidunetgo-android.sh), then
# publishes it three ways: a Release tagged `baidunetgo-android-<version>-
# <short_sha>`, the signed F-Droid repository (publish-fdroid.sh, same as
# app-build.yml's publish job), and the in-app update feed
# fdroid/baidunetgo/update.json — deployed by deploy-pages.yml, canonical at
# https://software.sparkzh.top/baidunetgo/update.json, generated by
# scripts/baidunetgo-android-feed.py. The APK is signed with the committed
# patchwork test keystore (or PATCHWORK_KEYSTORE_BASE64 and friends, the same
# secrets app-build.yml's Materialize keystore step reads); the dev.jks inside the
# upstream tree is never used.

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/baidunetgo/**'
      - '.github/workflows/baidunetgo.yml'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baidunetgo-build
  cancel-in-progress: false

env:
  WATCH_INTERVAL_DAYS: '10'

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      due: ${{ steps.gate.outputs.due }}
      changed: ${{ steps.check.outputs.changed }}
      force: ${{ steps.check.outputs.force }}
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Respect the 10-day window
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Same rule as the app pipelines: the state commits below push to
          # main, so a manual dispatch from another branch must not run.
          if [[ "${GITHUB_REF_NAME:-}" != "main" ]]; then
            echo "::error::This pipeline only runs from main (got '${GITHUB_REF_NAME:-<unset>}')"
            exit 1
          fi
          days="${WATCH_INTERVAL_DAYS:-10}"
          due=true
          if [[ "$EVENT" == "schedule" ]]; then
            last="$(jq -r '.baidunetgo // empty' .watch-state.json 2>/dev/null || true)"
            if [[ -n "$last" ]]; then
              if last_epoch="$(date -u -d "$last" +%s 2>/dev/null)"; then
                age=$(( $(date -u +%s) - last_epoch ))
                if (( age < days * 86400 )); then
                  due=false
                  echo "::notice::Last BaiduNetGo watch was ${age}s ago; the next one is due in $(( days * 86400 - age ))s."
                fi
              else
                echo "::warning::Unreadable timestamp '$last' in .watch-state.json; checking upstream anyway."
              fi
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Resolve the upstream head
        id: check
        if: steps.gate.outputs.due == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/pengstem/baidunetgo.git"
          sha=""
          for attempt in 1 2 3; do
            sha="$(git ls-remote "$upstream_url" refs/heads/main 2>/dev/null | awk 'NR == 1 { print $1 }' || true)"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && break
            echo "    ls-remote attempt ${attempt}/3 failed; retrying"
            sleep $(( attempt * 5 ))
          done
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve $upstream_url main"; exit 1; }

          previous="$(jq -r '.baidunetgo // empty' desktop/.build-state.json 2>/dev/null || true)"
          changed=false
          [[ "$sha" != "$previous" ]] && changed=true

          # A push that touches desktop/baidunetgo/** is an explicit queue
          # change, and a manual dispatch is an explicit request; both build
          # immediately exactly like the other apps' pipelines, even when the
          # upstream SHA has not moved.
          force=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ]]; then
            force=true
          fi
          build=false
          if [[ "$changed" == "true" || "$force" == "true" ]]; then
            build=true
          fi

          echo "    upstream:  $sha"
          echo "    last built: ${previous:-none}"
          echo "    changed:   $changed"
          echo "    force:     $force"
          echo "    build:     $build"
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "changed=$changed"
            echo "force=$force"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build x86
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      built_sha: ${{ steps.info.outputs.built_sha }}
      fallback: ${{ steps.info.outputs.fallback }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Runs before setup-go so the Go version can be read from the patched
      # tree's go.mod (upstream may move to a newer Go than the runner's).
      - name: Fetch upstream and rebase the queue
        run: ./scripts/build-baidunetgo.sh --prepare

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .cache/work/baidunetgo/go.mod
          cache: true
          cache-dependency-path: .cache/work/baidunetgo/go.sum

      - name: Install NSIS, for the Windows installers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Build linux/amd64 and windows/amd64
        env:
          PATCHWORK_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/desktop/baidunetgo/update.json
        run: ./scripts/build-baidunetgo.sh --build --out "$RUNNER_TEMP/dist"

      # The runner has docker but no pacman/makepkg: the script pulls
      # archlinux:base-devel, maps the runner uid/gid into it and runs makepkg
      # there. The package lands in $RUNNER_TEMP/dist, so the Release and the
      # workflow artifact pick it up with the other installers.
      - name: Build the Arch Linux package
        timeout-minutes: 15
        run: ./scripts/build-baidunetgo-arch.sh --dist "$RUNNER_TEMP/dist"

      - name: Read the build info
        id: info
        run: |
          set -euo pipefail
          info="$RUNNER_TEMP/dist/build-info.txt"
          [[ -f "$info" ]] || { echo "::error::build-info.txt missing"; exit 1; }
          built_sha="$(sed -n 's/^upstream_commit=//p' "$info" | head -n 1)"
          fallback="$(sed -n 's/^upstream_fallback=//p' "$info" | head -n 1)"
          version="$(sed -n 's/^version=//p' "$info" | head -n 1)"
          arch_pkg="$(sed -n 's/^file=\(.*\.pkg\.tar\.zst\) size=.*/\1/p' \
            "$info" | head -n 1)"
          {
            echo "built_sha=$built_sha"
            echo "fallback=$fallback"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### BaiduNetGo x86 build'
            echo ''
            echo "- upstream head: \`${{ needs.check.outputs.sha }}\`"
            echo "- built commit: \`$built_sha\` (fallback: ${fallback:-0})"
            echo "- version: ${version:-unknown}"
            echo "- Arch Linux package: \`${arch_pkg:-none}\` (\`pacman -U\`)"
            echo ''
            echo '| file | size |'
            echo '| --- | --- |'
            find "$RUNNER_TEMP/dist" -maxdepth 1 -type f ! -name build-info.txt -printf '| %f | %s B |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the feed generator
        run: ./scripts/test-baidunetgo-feed.sh

      - name: Upload the x86 installers
        uses: actions/upload-artifact@v7
        with:
          name: baidunetgo-x86-${{ needs.check.outputs.short_sha }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

      - name: Publish the installers
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.info.outputs.version }}
          BUILT_SHA: ${{ steps.info.outputs.built_sha }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$VERSION" ]] || { echo "::error::no version in build-info.txt"; exit 1; }
          SHORT_SHA="${BUILT_SHA:0:7}"
          [[ "$SHORT_SHA" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::bad built commit '$BUILT_SHA'"; exit 1; }
          TAG="baidunetgo-desktop-${VERSION}-${SHORT_SHA}"
          NOTES="$RUNNER_TEMP/feed-notes.md"
          patch_count="$(sed -n 's/^patch_count=//p' "$RUNNER_TEMP/dist/build-info.txt" | head -n 1)"
          fallback="$(sed -n 's/^upstream_fallback=//p' "$RUNNER_TEMP/dist/build-info.txt" | head -n 1)"
          {
            echo "社区修复版（x86），基于上游 ${SHORT_SHA}，含 ${patch_count:-若干} 个补丁。"
            if [[ "${fallback:-0}" == "1" ]]; then
              echo ''
              echo "补丁队列没能应用到上游最新的 ${UPSTREAM_SHA}，这一版基于上次成功构建的提交，下一轮会重试新的上游。"
            fi
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; replacing its assets"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "BaiduNetGo $VERSION (x86)" \
              --notes-file "$NOTES" \
              --latest=false
          fi

          files=()
          for file in "$RUNNER_TEMP/dist"/*; do
            [[ -f "$file" ]] || continue
            [[ "$(basename "$file")" == "build-info.txt" ]] && continue
            files+=("$file")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::no installers in $RUNNER_TEMP/dist"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber \
            || { echo "::error::could not upload the installers to release $TAG"; exit 1; }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Published ${#files[@]} assets to release $TAG"

      # The feed must be committed only after the release assets exist: its
      # platform URLs point straight at the tag uploaded above.
      - name: Write the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.publish.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$TAG" ]] || { echo "::error::no release tag from the publish step"; exit 1; }
          feed="desktop/baidunetgo/update.json"
          python3 scripts/baidunetgo-feed.py \
            --dist "$RUNNER_TEMP/dist" \
            --tag "$TAG" \
            --version "$VERSION" \
            --repo "$REPO" \
            --notes "$RUNNER_TEMP/feed-notes.md" \
            --out "$feed" | tee "$RUNNER_TEMP/feed.log"
          {
            echo ''
            echo "- update feed: https://raw.githubusercontent.com/${REPO}/main/${feed}"
            echo "- release: https://github.com/${REPO}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git add "$feed"
          if git diff --cached --quiet; then
            echo "Feed unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Publish the BaiduNetGo update feed [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main \
               && git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then
              echo "::notice::Update feed pushed"
              exit 0
            fi
            echo "    push attempt ${attempt}/3 failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::warning title=Feed commit failed::Could not push ${feed} (often HTTP 403: set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions')."

  android:
    name: Build Android
    needs: check
    # Same window and same queue replay as the desktop job: one 10-day check
    # covers both halves of the app (they share desktop/baidunetgo/patches).
    if: needs.check.result == 'success' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      built_sha: ${{ steps.info.outputs.built_sha }}
      fallback: ${{ steps.info.outputs.fallback }}
      version_code: ${{ steps.info.outputs.version_code }}
      version_name: ${{ steps.info.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Same replay as the desktop job's prepare: mirror upstream, check out
      # the head, `git am -3` the queue over it (with the one-shot fallback).
      # The prepared tree in .cache/work/baidunetgo is what both build
      # scripts consume, so desktop and Android come from one patched commit.
      - name: Fetch upstream and rebase the queue
        run: ./scripts/build-baidunetgo.sh --prepare

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Mirror app-build.yml: the hosted ubuntu-24.04 image already ships the
      # Android SDK; verify the preinstalled SDK and put sdkmanager on PATH.
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          uname -a
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            shopt -s nullglob
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                echo "Adding $(dirname "$candidate") to PATH"
                echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
                export PATH="$(dirname "$candidate"):$PATH"
                break
              fi
            done
            shopt -u nullglob
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version

      # The client's compileSdk/targetSdk is 37 (android/app/build.gradle.kts),
      # the same packages app-build.yml installs for the other apps. No NDK: the
      # app has no externalNativeBuild/ndkVersion.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "build-tools;37.0.0"
            "platforms;android-37.0"
            "platforms;android-37.1"
          )
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "${packages[@]}"; then
            echo "Stable channel failed; retrying with --channel=3 (preview packages)"
            sdkmanager --channel=3 --install "${packages[@]}"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # Same keystore handling as app-build.yml: the committed patchwork test
      # keystore by default, or the PATCHWORK_KEYSTORE_BASE64 family of
      # secrets when the owner configured them. The dev.jks inside the
      # upstream android/ tree is a development-only key and is never used.
      - name: Materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PATCHWORK_KEYSTORE_BASE64 }}
          INPUT_STORE_PASSWORD: ${{ secrets.PATCHWORK_STORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.PATCHWORK_KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.PATCHWORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/patchwork.jks"
          else
            cp signing/patchwork-test.jks "$RUNNER_TEMP/patchwork.jks"
          fi
          chmod 600 "$RUNNER_TEMP/patchwork.jks"
          {
            echo "PATCHWORK_KEYSTORE_FILE=$RUNNER_TEMP/patchwork.jks"
            echo "PATCHWORK_STORE_PASSWORD=${INPUT_STORE_PASSWORD:-patchwork123}"
            echo "PATCHWORK_KEY_ALIAS=${INPUT_KEY_ALIAS:-patchwork}"
            echo "PATCHWORK_KEY_PASSWORD=${INPUT_KEY_PASSWORD:-patchwork123}"
          } >> "$GITHUB_ENV"

      # Rewrites versionCode/versionName to the patchwork scheme (upstream ×
      # 100 + patch count; "<upstream>-patchwork"), builds :app:assembleRelease,
      # signs the APK with apksigner and verifies package/version metadata.
      - name: Build and sign the Android client
        run: ./scripts/build-baidunetgo-android.sh --out "$RUNNER_TEMP/dist-android"

      - name: Read the build info
        id: info
        run: |
          set -euo pipefail
          info="$RUNNER_TEMP/dist-android/build-info.txt"
          [[ -f "$info" ]] || { echo "::error::build-info.txt missing"; exit 1; }
          built_sha="$(sed -n 's/^upstream_commit=//p' "$info" | head -n 1)"
          fallback="$(sed -n 's/^upstream_fallback=//p' "$info" | head -n 1)"
          version_code="$(sed -n 's/^version_code=//p' "$info" | head -n 1)"
          version_name="$(sed -n 's/^version_name=//p' "$info" | head -n 1)"
          apk_name="$(sed -n 's/^apk=//p' "$info" | head -n 1)"
          {
            echo "built_sha=$built_sha"
            echo "fallback=$fallback"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "apk_name=$apk_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### BaiduNetGo Android build'
            echo ''
            echo "- upstream head: \`${{ needs.check.outputs.sha }}\`"
            echo "- built commit: \`$built_sha\` (fallback: ${fallback:-0})"
            echo "- versionCode: $version_code, versionName: $version_name"
            echo "- APK: \`$apk_name\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the feed generator
        run: ./scripts/test-baidunetgo-android-feed.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: baidunetgo-android-${{ needs.check.outputs.short_sha }}
          path: ${{ runner.temp }}/dist-android
          if-no-files-found: error

      # A tagged Release like the desktop one, never marked `latest`.
      - name: Publish the APK
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.info.outputs.version_name }}
          BUILT_SHA: ${{ steps.info.outputs.built_sha }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$VERSION_NAME" ]] || { echo "::error::no version_name in build-info.txt"; exit 1; }
          SHORT_SHA="${BUILT_SHA:0:7}"
          [[ "$SHORT_SHA" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::bad built commit '$BUILT_SHA'"; exit 1; }
          TAG="baidunetgo-android-${VERSION_NAME}-${SHORT_SHA}"
          NOTES="$RUNNER_TEMP/android-release-notes.md"
          patch_count="$(sed -n 's/^patch_count=//p' "$RUNNER_TEMP/dist-android/build-info.txt" | head -n 1)"
          fallback="$(sed -n 's/^upstream_fallback=//p' "$RUNNER_TEMP/dist-android/build-info.txt" | head -n 1)"
          {
            echo "社区修复版（Android），基于上游 ${SHORT_SHA}，含 ${patch_count:-若干} 个补丁。"
            if [[ "${fallback:-0}" == "1" ]]; then
              echo ''
              echo "补丁队列没能应用到上游最新的 ${UPSTREAM_SHA}，这一版基于上次成功构建的提交，下一轮会重试新的上游。"
            fi
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; replacing its assets"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "BaiduNetGo Android $VERSION_NAME" \
              --notes-file "$NOTES" \
              --latest=false
          fi

          apk_name="$(sed -n 's/^apk=//p' "$RUNNER_TEMP/dist-android/build-info.txt" | head -n 1)"
          apk="$RUNNER_TEMP/dist-android/$apk_name"
          [[ -n "$apk_name" && -f "$apk" ]] || { echo "::error::APK missing from $RUNNER_TEMP/dist-android"; exit 1; }
          gh release upload "$TAG" "$apk" --repo "$REPO" --clobber \
            || { echo "::error::could not upload the APK to release $TAG"; exit 1; }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Published the APK to release $TAG"

      # Same publisher app-build.yml's publish job runs: copies the APK into
      # fdroid/repo, prunes to three per package and signs the index with
      # `fdroid update`. Publishing here (not only on a Release) keeps the
      # F-Droid repo and the updater feed in step.
      - name: Install fdroidserver
        run: |
          set -euo pipefail
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish to the F-Droid repository
        env:
          BUILT_SHA: ${{ steps.info.outputs.built_sha }}
          FALLBACK: ${{ steps.info.outputs.fallback }}
        run: |
          set -euo pipefail
          # A fallback build is published but must not mark the head as
          # successfully built — the same rule app-build.yml's publish job
          # applies to the other Android apps.
          state='{}'
          if [[ "${FALLBACK:-0}" != "1" && "$BUILT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            state="$(jq -cn --arg sha "$BUILT_SHA" '{"baidunetgo-android": $sha}')"
          else
            echo "::warning title=Fallback build::The Android APK was built from ${BUILT_SHA:-an older upstream commit}; not recording it in fdroid/.build-state.json"
          fi
          ./scripts/publish-fdroid.sh --apk-dir "$RUNNER_TEMP/dist-android" --state-json "$state"

      # The feed names the release asset uploaded above, so it must be
      # written after that step. deploy-pages.yml deploys the committed
      # fdroid/ directory (this file included) when the commit lands on main.
      - name: Write the Android update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$TAG" ]] || { echo "::error::no release tag from the publish step"; exit 1; }
          feed="fdroid/baidunetgo/update.json"
          python3 scripts/baidunetgo-android-feed.py \
            --dist "$RUNNER_TEMP/dist-android" \
            --tag "$TAG" \
            --repo "$REPO" \
            --notes "$RUNNER_TEMP/android-release-notes.md" \
            --out "$feed" | tee "$RUNNER_TEMP/android-feed.log"
          {
            echo ''
            echo "- Android update feed: https://software.sparkzh.top/baidunetgo/update.json"
            echo "- Android release: https://github.com/${REPO}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git add "$feed" fdroid/repo fdroid/.build-state.json
          if git diff --cached --quiet; then
            echo "Feed and repository unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Publish the BaiduNetGo Android update feed [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main \
               && git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then
              echo "::notice::Android update feed pushed"
              exit 0
            fi
            echo "    push attempt ${attempt}/3 failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::warning title=Android feed commit failed::Could not push ${feed} (often HTTP 403: set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions')."

  record:
    name: Record the watch time
    needs: [check, build, android]
    # Advance the window after a successful build (schedule, push or a
    # dispatch), or after a scheduled check that found nothing to build.
    # A failed build leaves the timestamp alone, so the next daily run retries
    # instead of waiting 10 days. A successful push/dispatch build also advances
    # it, so the next automatic build is at least 10 days later.
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.due == 'true' &&
      (
        (github.event_name == 'schedule' && needs.check.outputs.build != 'true') ||
        (needs.check.outputs.build == 'true' &&
         needs.build.result == 'success' &&
         needs.android.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Update the state files
        env:
          CHANGED: ${{ needs.check.outputs.changed }}
          BUILT_SHA: ${{ needs.build.outputs.built_sha }}
          FALLBACK: ${{ needs.build.outputs.fallback }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          jq --arg t "$now" '. + {baidunetgo: $t}' .watch-state.json >"$tmp"
          mv "$tmp" .watch-state.json
          # A fallback was built from an older commit: keep the recorded head so
          # the next window retries the real upstream change.
          if [[ "$CHANGED" == "true" && "$BUILT_SHA" =~ ^[0-9a-f]{40}$ && "${FALLBACK:-0}" != "1" ]]; then
            tmp="$(mktemp)"
            jq --arg app baidunetgo --arg sha "$BUILT_SHA" '.[$app] = $sha' desktop/.build-state.json >"$tmp"
            mv "$tmp" desktop/.build-state.json
          fi
          git diff -- .watch-state.json desktop/.build-state.json

      - name: Commit the state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git add .watch-state.json desktop/.build-state.json
          if git diff --cached --quiet; then
            echo "No state change to commit"
            exit 0
          fi
          git commit -m "Record the BaiduNetGo watch [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main \
               && git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then
              echo "::notice::State pushed"
              exit 0
            fi
            echo "    push attempt ${attempt}/3 failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::warning title=State commit failed::Could not push .watch-state.json / desktop/.build-state.json (often HTTP 403: set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions')."
name: Watchdog

# Keeps one `Upstream watch` window per 12 hours.
#
# `Upstream watch` opens a one-hour polling window every 12 hours. Two things
# can leave a hole: a delayed `schedule` (GitHub treats crons as best-effort and
# a 2-4 hour slip was measured on this repository) and a job reclaimed by the
# hosted-runner infrastructure mid-flight (run #11, 2026-10-28, lost
# communication with the server after 4h50m). This workflow is the cheap hourly
# safety net:
#
#   - a watch run is queued or running         -> nothing to do
#   - the last window started < 12h ago and    -> nothing to do
#     ran for a full window
#   - otherwise (schedule slipped, or the      -> dispatch a fresh window
#     previous window died early)
#
# It builds and publishes nothing; `build.yml` remains the only builder.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-watchdog
  cancel-in-progress: false

jobs:
  ensure-watch:
    name: Ensure the watcher is running
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restart the watcher when a window is missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/upstream-watch.yml"
          auth=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          retry=(--retry 3 --retry-all-errors --retry-delay 5)
          window_hours="${WATCH_WINDOW_HOURS:-12}"

          runs="$(curl -fsS "${retry[@]}" "${auth[@]}" "$api/runs?per_page=30")"
          # queued / in_progress / waiting / requested all count as alive.
          alive="$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")"
          last="$(jq -r '.workflow_runs[0] // empty | "#\(.run_number) \(.status) \(.conclusion // "-") created \(.created_at)"' <<<"$runs")"
          echo "Newest watch run: ${last:-none}"

          if (( alive > 0 )); then
            echo "::notice::Upstream watch is alive ($alive active run(s)); nothing to do."
            exit 0
          fi

          if [[ -n "$last" ]]; then
            created="$(jq -r '.workflow_runs[0].created_at' <<<"$runs")"
            updated="$(jq -r '.workflow_runs[0].updated_at // .workflow_runs[0].created_at' <<<"$runs")"
            age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
            lasted=$(( $(date -u -d "$updated" +%s) - $(date -u -d "$created" +%s) ))
            echo "Previous window: started ${age}s ago and lasted ${lasted}s."
            # A healthy window runs ~58 minutes; under 45 means it was cut short.
            # The 10-minute slack absorbs schedule jitter around the 12h mark.
            if (( age < window_hours * 3600 - 600 && lasted >= 2700 )); then
              echo "::notice::Next window is due in $(( window_hours * 3600 - age ))s; nothing to do."
              exit 0
            fi
          fi

          echo "No usable watch window in the last ${window_hours}h; dispatching a fresh one."
          if curl -fsS "${retry[@]}" -X POST "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "$api/dispatches"; then
            echo "::notice::Started a fresh Upstream watch run."
          else
            echo "::error::Could not dispatch Upstream watch (does the job still have actions: write?)"
            exit 1
          fi

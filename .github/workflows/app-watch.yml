name: App watcher

# Reusable body of the per-app watchers.
#
# Every app has a small workflow (expenses.yml, screentime.yml, fcitx5.yml,
# basicsync.yml, gadgetbridge.yml) whose triggers are limited to that app's own
# directory, so a commit for one app never starts a build for another. This
# file holds the shared logic they call:
#
#  * a schedule run only builds once the 10-day window has passed and the
#    upstream branch actually moved;
#  * a push touching apps/<app>/ builds that app;
#  * a manual dispatch always builds;
#  * before building, the queue is re-anchored on the upstream head when the
#    stored anchor is stale or missing (scripts/rebase-queue.sh: apply with
#    git am -3, export the result back, commit it), so the build never runs a
#    queue that was written for an older upstream;
#  * the build itself is the shared patchwork builder, dispatched with
#    app=<app>, which keeps signing, the F-Droid repository, the README table
#    and Pages in one place.
#
# The caller passes the app id and what kind of event it saw, because a
# reusable workflow cannot read the caller's event name.
on:
  workflow_call:
    inputs:
      app:
        description: App id, i.e. the directory name under apps/
        required: true
        type: string
      trigger:
        description: push, schedule or manual
        required: true
        type: string

env:
  WATCH_INTERVAL_DAYS: '10'

jobs:
  watch:
    name: Watch ${{ inputs.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the upstream head, the anchor and the 10-day window
        id: decide
        env:
          APP: ${{ inputs.app }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          set -euo pipefail
          conf="apps/$APP/app.conf"
          [[ -f "$conf" ]] || { echo "::error::missing $conf"; exit 1; }
          # shellcheck source=/dev/null
          source "$conf"

          head="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_BRANCH" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve $UPSTREAM_URL ($UPSTREAM_BRANCH)"
            exit 1
          fi

          anchor="$(tr -d '[:space:]' < "apps/$APP/upstream.txt" 2>/dev/null || true)"
          last_built="$(jq -r --arg app "$APP" '.[$app] // empty' fdroid/.build-state.json 2>/dev/null || true)"

          moved=false
          if [[ "$head" != "$last_built" ]]; then
            moved=true
          fi

          days="${WATCH_INTERVAL_DAYS:-10}"
          due=true
          last="$(jq -r --arg app "$APP" '.[$app] // empty' .watch-state.json 2>/dev/null || true)"
          if [[ -n "$last" ]] && last_epoch="$(date -u -d "$last" +%s 2>/dev/null)"; then
            age=$(( $(date -u +%s) - last_epoch ))
            if (( age < days * 86400 )); then
              due=false
              echo "::notice::Last $APP window was ${age}s ago; the next one is due in $(( days * 86400 - age ))s."
            fi
          fi

          # The queue has to be re-anchored when it was written for another
          # upstream commit, or when no anchor was recorded yet.
          rebase=false
          if [[ -z "$anchor" || "$anchor" != "$head" ]]; then
            rebase=true
          fi

          build=false
          case "$TRIGGER" in
            push|manual)
              build=true
              ;;
            schedule)
              if [[ "$moved" == "true" && "$due" == "true" ]]; then
                build=true
              fi
              ;;
            *)
              echo "::error::unknown trigger '$TRIGGER' (expected push, schedule or manual)"
              exit 1
              ;;
          esac

          echo "app=$APP trigger=$TRIGGER"
          echo "upstream=$head anchor=${anchor:-<unknown>} last_built=${last_built:-<unknown>}"
          echo "moved=$moved due=$due rebase=$rebase build=$build"
          {
            echo "upstream=$head"
            echo "rebase=$rebase"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: Re-anchor the patch queue on the upstream head
        id: rebase
        if: steps.decide.outputs.rebase == 'true'
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          ./scripts/rebase-queue.sh "$APP"
          git add "apps/$APP"
          if git diff --cached --quiet; then
            echo "The stored queue already matches the rebased queue"
            exit 0
          fi
          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git commit -m "chore($APP): rebase the queue onto $(cut -c1-7 "apps/$APP/upstream.txt") [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Record the upstream window
        if: steps.decide.outputs.build == 'true'
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          jq --arg app "$APP" --arg ts "$now" '. + {($app): $ts}' .watch-state.json >"$tmp"
          mv "$tmp" .watch-state.json
          git add .watch-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git commit -m "Record the $APP upstream window [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Dispatch the patchwork build
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --ref "${{ github.ref_name }}" \
            -f app="$APP" \
            -f force=true
          echo "::notice::Dispatched the patchwork build for $APP"

      - name: Open an issue when the queue no longer re-anchors
        if: failure() && steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          HEAD_SHA: ${{ steps.decide.outputs.upstream }}
        run: |
          set -euo pipefail
          title="$APP: the patch queue does not rebase onto $HEAD_SHA"
          if gh issue list --state open --search "in:title $title" | grep -q .; then
            echo "An issue for this commit is already open"
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "Applying \`apps/$APP/patches\` to \`$HEAD_SHA\` failed, so the queue could not be re-anchored and nothing was built.

          Resolve the conflict in a local clone (run \`scripts/rebase-queue.sh $APP\`, then fix the conflict in the worktree the script names), regenerate the queue, and push the result. The next scheduled run then builds it."

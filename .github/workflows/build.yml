name: Patchwork build

on:
  schedule:
    # One upstream window every 10 days. GitHub crons cannot express "every 10
    # days" (a `*/10` day-of-month rule fires on the 1st, 11th, 21st and 31st),
    # so this runs daily and the check job returns early while
    # .watch-state.json's `android` timestamp is younger than 10 days. Scheduled
    # runs are best-effort; a delayed day only shifts the window.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App id, or "all" (apps come from apps/*/app.conf)
        type: string
        default: all
      force:
        description: Build even when upstream has not changed
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: patchwork-build-${{ github.ref }}
  cancel-in-progress: false

env:
  WATCH_INTERVAL_DAYS: '10'

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      any_changed: ${{ steps.check.outputs.any_changed }}
      due: ${{ steps.gate.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Scheduled runs are gated on .watch-state.json so the upstream window is
      # every 10 days; pushes and manual dispatches always check. The timestamp
      # is advanced by the record-check job at the end of a clean run (see the
      # rationale there).
      - name: Respect the 10-day window
        id: gate
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          days="${WATCH_INTERVAL_DAYS:-10}"
          due=true
          last="$(jq -r '.android // empty' .watch-state.json 2>/dev/null || true)"
          if [[ -n "$last" ]]; then
            if last_epoch="$(date -u -d "$last" +%s 2>/dev/null)"; then
              age=$(( $(date -u +%s) - last_epoch ))
              if (( age < days * 86400 )); then
                due=false
                echo "::notice::Last upstream window was ${age}s ago; the next one is due in $(( days * 86400 - age ))s."
              fi
            else
              echo "::warning::Unreadable timestamp '$last' in .watch-state.json; checking upstream anyway."
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      # Decide which apps to build:
      #  * push  -> only the apps whose apps/<app>/** paths changed in this push;
      #            a change to scripts/** or a workflow rebuilds all of them;
      #            unknown/forced pushes fall back to all of them for safety;
      #  * dispatch -> the selected app (or all with force);
      #  * schedule -> only apps whose upstream SHA changed.
      - name: Resolve build matrix
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCE_INPUT: ${{ inputs.force }}
          APP_INPUT: ${{ inputs.app }}
          DUE: ${{ steps.gate.outputs.due }}
        run: |
          set -euo pipefail
          # A scheduled run outside the 10-day window does nothing: emit an
          # empty matrix so the build/publish jobs are skipped cleanly.
          if [[ "$EVENT" == "schedule" && "$DUE" == "false" ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # App list comes from apps/*/app.conf, so adding an app needs no
          # workflow edit.
          mapfile -t ALL_APPS < <(find apps -mindepth 2 -maxdepth 2 -name app.conf | LC_ALL=C sort | cut -d/ -f2)
          all_apps="$(printf '%s ' "${ALL_APPS[@]}")"
          all_apps="${all_apps%"${all_apps##*[! ]}"}"
          args=()
          if [[ "$EVENT" == "push" ]]; then
            selected=""
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)"
              pick=()
              while IFS= read -r path; do
                case "$path" in
                  apps/*/*)
                    app="${path#apps/}"
                    app="${app%%/*}"
                    printf '%s\n' "${ALL_APPS[@]}" | grep -Fxq "$app" && pick+=("$app")
                    ;;
                  scripts/*|.github/workflows/*) pick=("${ALL_APPS[@]}"); break ;;
                esac
              done <<<"$changed_files"
              if [[ ${#pick[@]} -gt 0 ]]; then
                selected="$(printf '%s\n' "${pick[@]}" | sort -u | paste -sd' ' -)"
              fi
            fi
            # Unknown before-SHA (force push) or a non-app change: rebuild all.
            [[ -n "$selected" ]] || selected="$all_apps"
            echo "Push changed these apps: $selected"
            args=(--apps "$selected")
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ -n "${APP_INPUT:-}" && "$APP_INPUT" != "all" ]]; then
              args=(--apps "$APP_INPUT")
            elif [[ "$FORCE_INPUT" == "true" ]]; then
              args=(--all)
            fi
          fi
          if [[ ${#args[@]} -gt 0 ]]; then
            result="$(./scripts/check-upstream.sh "${args[@]}")"
          else
            result="$(./scripts/check-upstream.sh)"
          fi
          printf '%s\n' "$result"
          matrix="$(jq -c '.matrix' <<<"$result")"
          changed="$(jq -r '.changed' <<<"$result")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any_changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: check
    if: needs.check.outputs.any_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Hosted ubuntu-24.04 images already ship the Android SDK; setup-android
      # is both unnecessary and fragile (it failed on the ubuntu-26 image).
      # Just verify the preinstalled SDK and put sdkmanager on PATH.
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          uname -a
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            shopt -s nullglob
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                echo "Adding $(dirname "$candidate") to PATH"
                echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
                export PATH="$(dirname "$candidate"):$PATH"
                break
              fi
            done
            shopt -u nullglob
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          ls "$SDK_ROOT"
          df -h

      - name: Install Android SDK packages
        # android-37.x is a preview platform, so the stable channel may not
        # know it; retry on channel 3. No NDK is installed on purpose: the
        # app has no externalNativeBuild/ndkVersion and builds fine without
        # one (AGP only warns that prebuilt AAR libs cannot be stripped).
        # fdroiddata lists ndk 28.2.13676358 for upstream builds, but this
        # patchwork build does not need it.
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "build-tools;37.0.0"
            "platforms;android-37.0"
            "platforms;android-37.1"
          )
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "${packages[@]}"; then
            echo "Stable channel failed; retrying with --channel=3 (preview packages)"
            sdkmanager --channel=3 --install "${packages[@]}"
          fi

      # fcitx5-android compiles ~450 MB of submodules with the NDK and CMake,
      # so the 14 GB root filesystem of a hosted runner is too tight: free the
      # big toolchains and the SDK packages this leg does not use first. This
      # must stay before the NDK install below.
      - name: Free disk space (fcitx5)
        if: matrix.app == 'fcitx5'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            "$SDK_ROOT/emulator" \
            "$SDK_ROOT/system-images"
          # Largest preinstalled SDK packages this leg does not need. Keep
          # platforms/build-tools 36 (installed below) and 37 (other apps).
          sudo rm -rf \
            "$SDK_ROOT"/ndk/26.* \
            "$SDK_ROOT"/ndk/27.* \
            "$SDK_ROOT"/cmake/3.22.1 \
            "$SDK_ROOT"/platforms/android-3[0-5]* \
            "$SDK_ROOT"/build-tools/3[0-5].*
          sudo apt-get clean
          df -h /

      # extra-cmake-modules and gettext (msgfmt) are hard requirements of the
      # upstream CMake build (find_package(ECM) and add_subdirectory(po)).
      # Ninja comes from the SDK cmake package, so it is not installed via apt.
      - name: Install fcitx5 host and SDK dependencies
        if: matrix.app == 'fcitx5'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends extra-cmake-modules gettext
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmake;3.31.6" \
            "ndk;28.0.13004108"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PATCHWORK_KEYSTORE_BASE64 }}
          INPUT_STORE_PASSWORD: ${{ secrets.PATCHWORK_STORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.PATCHWORK_KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.PATCHWORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/patchwork.jks"
          else
            cp signing/patchwork-test.jks "$RUNNER_TEMP/patchwork.jks"
          fi
          chmod 600 "$RUNNER_TEMP/patchwork.jks"
          {
            echo "PATCHWORK_KEYSTORE_FILE=$RUNNER_TEMP/patchwork.jks"
            echo "PATCHWORK_STORE_PASSWORD=${INPUT_STORE_PASSWORD:-patchwork123}"
            echo "PATCHWORK_KEY_ALIAS=${INPUT_KEY_ALIAS:-patchwork}"
            echo "PATCHWORK_KEY_PASSWORD=${INPUT_KEY_PASSWORD:-patchwork123}"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.app }}
        run: ./scripts/build-app.sh "${{ matrix.app }}" --out "$RUNNER_TEMP/dist/${{ matrix.app }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: patchwork-${{ matrix.app }}
          path: ${{ runner.temp }}/dist/${{ matrix.app }}
          if-no-files-found: error

      - name: Dump build environment on failure
        if: failure()
        run: |
          set -x
          uname -a || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          df -h || true
          free -g || true
          ls -la "$RUNNER_TEMP/dist/${{ matrix.app }}" 2>/dev/null || true
          find "$RUNNER_TEMP/dist" -maxdepth 3 -type f 2>/dev/null || true

  publish:
    name: Publish F-Droid repository
    needs:
      - check
      - build
    # Run even when one matrix leg failed (fail-fast is off), so surviving
    # artifacts still get published. Skip cleanly when nothing changed.
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.any_changed == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          uname -a
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            shopt -s nullglob
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                echo "Adding $(dirname "$candidate") to PATH"
                echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
                export PATH="$(dirname "$candidate"):$PATH"
                break
              fi
            done
            shopt -u nullglob
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          ls "$SDK_ROOT"
          df -h

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "platform-tools" "build-tools;37.0.0"; then
            sdkmanager --channel=3 --install "platform-tools" "build-tools;37.0.0"
          fi

      # Artifacts are downloaded without merge-multiple, so each matrix leg
      # lands in dist/patchwork-<app>/. publish-fdroid.sh searches
      # recursively, which also keeps the per-app build-info.txt files apart.
      - name: Download APK artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: patchwork-*

      - name: Detect downloaded APKs
        id: apks
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist -type f -name '*.apk' 2>/dev/null | LC_ALL=C sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::warning::No APK artifacts were downloaded; skipping publish"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Found %d APK(s):\n' "${#apks[@]}"
            printf '  %s\n' "${apks[@]}"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fdroidserver
        if: steps.apks.outputs.found == 'true'
        run: |
          set -euo pipefail
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test publish dedupe
        if: steps.apks.outputs.found == 'true'
        run: |
          set -euo pipefail
          apk="$(find dist -type f -name '*.apk' | head -n 1)"
          ./scripts/test-publish-fdroid.sh "$apk"

      - name: Publish to F-Droid repository
        if: steps.apks.outputs.found == 'true'
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          set -euo pipefail
          # Only record an upstream SHA for apps whose APK really exists and
          # whose build was not a fallback. A failed matrix leg keeps its
          # previous state so the next run retries it; a fallback build is
          # published but must not mark the head as successfully built, or the
          # next scheduled run would skip the app while the queue is still
          # broken.
          state='{}'
          while IFS=$'\t' read -r app sha; do
            [[ -n "$app" ]] || continue
            info="dist/patchwork-$app/build-info.txt"
            if [[ -n "$(find "dist/patchwork-$app" -type f -name '*.apk' -print -quit 2>/dev/null)" ]]; then
              fallback="$(sed -n 's/^upstream_fallback=//p' "$info" 2>/dev/null | head -n 1)"
              built_sha="$(sed -n 's/^upstream_commit=//p' "$info" 2>/dev/null | head -n 1)"
              if [[ "$fallback" == "1" ]]; then
                echo "::warning title=Fallback build::$app was built from ${built_sha:-an older upstream commit} because the patch queue does not apply to $sha; keeping the previous build state so the next run retries $sha"
                continue
              fi
              # Record the commit the APK was actually built from, not only the
              # one the check job resolved: upstream can move between jobs.
              record_sha="${built_sha:-$sha}"
              if [[ -n "$built_sha" && "$built_sha" != "$sha" ]]; then
                echo "::warning title=Upstream moved::$app was built from $built_sha while the check job resolved $sha; recording the built commit"
              fi
              state="$(jq -c --arg app "$app" --arg sha "$record_sha" '. + {($app): $sha}' <<<"$state")"
            else
              echo "::warning::No APK for '$app' (build failed or artifact missing); keeping previous build state"
            fi
          done < <(jq -r '.include[]? | [.app, .sha] | @tsv' <<<"$MATRIX")
          printf 'Build state: %s\n' "$state"
          expected="$(jq '.include | length' <<<"$MATRIX")"
          recorded="$(jq 'keys | length' <<<"$state")"
          if (( recorded < expected )); then
            echo "::warning title=Incomplete build state::Recorded $recorded of $expected app(s); a fallback build or a missing APK keeps the previous state so the next upstream window retries it."
          fi
          ./scripts/publish-fdroid.sh --apk-dir dist --state-json "$state"

      # Keep README.md / README.zh-CN.md in sync with what was actually built:
      # upstream revision, patch count and the versionCode/versionName of the
      # APKs published above. Apps without a fresh APK keep their row untouched,
      # so a failed matrix leg never rolls another app's row back.
      - name: Update README app table
        if: steps.apks.outputs.found == 'true'
        run: |
          set -euo pipefail
          ./scripts/update-readme.sh --apk-dir dist

      - name: Commit repository changes
        id: commit
        if: steps.apks.outputs.found == 'true'
        # A repo whose default workflow permissions are read-only makes this
        # fail with 403. That must not prevent the Pages deployment below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Automated commits below use the same identity as the patch history.
        run: |
          set -euo pipefail
          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git add fdroid/repo fdroid/.build-state.json README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No repository changes to commit"
            exit 0
          fi
          git commit -m "Update F-Droid repo [skip ci]"
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main

      - name: Report commit-back failure
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::warning title=Commit-back failed::Pushing fdroid/repo to main failed (often HTTP 403)."
          echo "::warning::Pages will still be deployed from this run's artifact. To fix the commit-back, set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions'."

      # Pages is optional: enablement needs a PAT/App token (a plain
      # GITHUB_TOKEN cannot create the Pages site), so these steps must not
      # turn a successful publish into a red run. The owner enables Pages once
      # in Settings -> Pages -> Source: GitHub Actions.
      - name: Configure Pages
        id: pages
        if: steps.apks.outputs.found == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        if: steps.apks.outputs.found == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: fdroid

      - name: Deploy Pages
        id: deployment
        if: steps.apks.outputs.found == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Report Pages deployment skipped
        if: >-
          steps.apks.outputs.found == 'true' &&
          (steps.pages.outcome == 'failure' ||
           steps.pages_artifact.outcome == 'failure' ||
           steps.deployment.outcome == 'failure')
        run: |
          msg="GitHub Pages could not be deployed from this run. The F-Droid repo is still committed (and available via the raw.githubusercontent.com fallback). To enable Pages, open Settings -> Pages -> Build and deployment -> Source and select 'GitHub Actions'."
          echo "::warning title=GitHub Pages not enabled::$msg"
          {
            echo '### GitHub Pages not deployed'
            echo ''
            echo "$msg"
            echo ''
            echo '- Canonical repo URL once Pages is enabled: https://pilihu2022.github.io/Software-Repo/repo'
            echo '- Fallback while Pages is off: https://raw.githubusercontent.com/PILIHU2022/Software-Repo/main/fdroid/repo'
          } >> "$GITHUB_STEP_SUMMARY"

  record-check:
    name: Record the watch time
    needs:
      - check
      - build
      - publish
    # Advance the 10-day window after a scheduled run that really checked and
    # did not fail hard: either nothing changed, or the build and publish jobs
    # both finished. A fallback (the queue did not apply to the head) counts as
    # a finished run — F-Droid already keeps the old build state, so the next
    # window retries the new head. Failed legs or a failed publish leave the
    # timestamp alone, so the next daily run retries instead of waiting 10
    # days. Pushes and manual dispatches never move the window.
    if: >-
      success() &&
      github.event_name == 'schedule' &&
      needs.check.result == 'success' &&
      needs.check.outputs.due == 'true' &&
      (needs.check.outputs.any_changed != 'true' ||
       (needs.build.result == 'success' && needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Update the watch state
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          jq --arg t "$now" '. + {android: $t}' .watch-state.json >"$tmp"
          mv "$tmp" .watch-state.json
          cat .watch-state.json

      - name: Commit the state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "DeepSeek Harness"
          git config user.email "noreply@deepseek.com"
          git add .watch-state.json
          if git diff --cached --quiet; then
            echo "No state change to commit"
            exit 0
          fi
          git commit -m "Record the upstream watch [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main \
               && git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then
              echo "::notice::Watch state pushed"
              exit 0
            fi
            echo "    push attempt ${attempt}/3 failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::warning title=Watch state commit failed::Could not push .watch-state.json (often HTTP 403: set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions')."

  notify-failure:
    name: Report failure
    needs:
      - check
      - build
      - publish
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Patchwork build failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Job logs are not readable without authentication, so copy the
            // tail of every failed job into the issue; this is our public
            // debugging channel.
            const excerpts = [];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              for (const job of jobs.filter((j) => j.conclusion === 'failure').slice(0, 5)) {
                try {
                  const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner,
                    repo,
                    job_id: job.id,
                  });
                  const raw = typeof res.data === 'string'
                    ? res.data
                    : Buffer.from(res.data).toString('utf8');
                  const tail = raw.split('\n').slice(-200).join('\n');
                  excerpts.push(`### ${job.name}\n\n\`\`\`\n${tail.slice(-12000)}\n\`\`\``);
                } catch (err) {
                  excerpts.push(`### ${job.name}\n\nCould not download logs: ${err.message}`);
                }
              }
            } catch (err) {
              excerpts.push(`Could not list jobs: ${err.message}`);
            }

            let body = [
              `The patchwork build failed: ${runUrl}`,
              '',
              'Local reproduction:',
              '```bash',
              'export ANDROID_HOME=/path/to/android-sdk',
              './scripts/build-app.sh expenses --no-build',
              './scripts/build-app.sh screentime --no-build',
              './scripts/build-app.sh expenses',
              './scripts/build-app.sh screentime',
              '```',
            ].join('\n');
            if (excerpts.length > 0) {
              body += '\n\n## Failed job logs (tail)\n\n' + excerpts.join('\n\n');
            }
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n(truncated)';
            }

            // A broken queue is retried by the next daily run, so a comment per
            // attempt would bury the first, useful one. Keep one comment per
            // window; the run itself still exists for drill-down.
            const THROTTLE_MS = 6 * 60 * 60 * 1000;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: existing.number,
                per_page: 100,
              });
              const lastAt = comments.reduce(
                (max, comment) => Math.max(max, Date.parse(comment.created_at) || 0),
                0,
              );
              const ageMs = Date.now() - lastAt;
              if (lastAt > 0 && ageMs < THROTTLE_MS) {
                console.log(
                  `Throttled: last failure comment was ${Math.round(ageMs / 60000)} minutes ago`,
                );
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

  notify-recovered:
    name: Close failure issue on recovery
    needs:
      - check
      - build
      - publish
    # Only a run that actually built something is a recovery. Skipped runs
    # (upstream unchanged) must not close an issue about a real failure.
    if: >-
      success() &&
      needs.check.outputs.any_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Patchwork build failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              console.log('No open failure issue; nothing to close');
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Recovered: this run built and published successfully — ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
            console.log(`Closed issue #${existing.number}`);

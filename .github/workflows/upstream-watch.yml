name: Upstream watch

# The schedule event is best-effort: GitHub throttles frequent crons on busy
# runners, so `*/15` was observed to fire every 2-4 hours. This workflow polls
# on its own instead: every 12 hours it opens a one-hour window (`7 */12 * * *`)
# that checks every upstream branch every 15 minutes and dispatches build.yml as
# soon as a new upstream commit shows up. A window never outlives 60 minutes,
# far away from the 6-hour job limit.
#
# It does not build anything itself; build.yml stays the single place that
# patches and publishes.
#
# watchdog.yml guards the windows: hourly it makes sure one is queued or running
# and dispatches a fresh one when the previous window is 12 hours old or died
# early (the hosted-runner infrastructure can reclaim a job mid-flight, as run
# #11 did on 2026-10-28).

on:
  schedule:
    - cron: '7 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Poll upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Poll upstream and dispatch builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          poll_interval="${WATCH_POLL_SECONDS:-900}"      # 15 minutes between checks
          settle_interval="${WATCH_SETTLE_SECONDS:-1200}" # after a dispatch, give the build time to run
          window_seconds="${WATCH_WINDOW_SECONDS:-3480}"  # 58 minutes, inside the 60-minute job cap
          deadline=$(( $(date +%s) + window_seconds ))
          polls=0

          while true; do
            remaining=$(( deadline - $(date +%s) ))
            if (( remaining <= 0 )); then break; fi
            polls=$(( polls + 1 ))

            echo "::group::Poll #$polls at $(date -u +%FT%TZ)"
            pause="$poll_interval"
            if ! json="$(./scripts/check-upstream.sh)"; then
              echo "check-upstream.sh failed; will retry next round"
              echo "::endgroup::"
            else
              # stdout is the JSON matrix, stderr is the human summary (shown in the log).
              printf '%s\n' "$json"
              echo "::endgroup::"

              if [[ "$(jq -r '.changed // false' <<<"$json" 2>/dev/null)" == "true" ]]; then
                apps="$(jq -r '[.matrix.include[].app] | join(", ")' <<<"$json")"
                echo "Upstream changed for: $apps -> dispatching build.yml"
                if curl -sf -X POST \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$REPO/actions/workflows/build.yml/dispatches" \
                    -d '{"ref":"main"}'; then
                  echo "::notice::Dispatched Patchwork build for: $apps"
                else
                  echo "::warning::Could not dispatch build.yml (token permissions?)"
                fi
                # The dispatched build updates .build-state.json when it publishes;
                # wait for that instead of dispatching the same change again.
                pause="$settle_interval"
              fi
            fi

            # Never sleep past the deadline: the window must stay under one hour.
            remaining=$(( deadline - $(date +%s) ))
            if (( remaining <= 0 )); then break; fi
            if (( pause > remaining )); then pause="$remaining"; fi
            sleep "$pause"
          done
          echo "Watch window finished after $polls poll(s)."

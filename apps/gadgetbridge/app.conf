# Patchwork configuration for Gadgetbridge.
# This file is sourced by the scripts in scripts/ — it is not executable.

APP_ID="gadgetbridge"
PROJECT_NAME="Gadgetbridge"
# Upstream lives on Codeberg; the default branch is master.
UPSTREAM_URL="https://codeberg.org/Freeyourgadget/Gadgetbridge.git"
UPSTREAM_BRANCH="master"
PACKAGE="nodomain.freeyourgadget.gadgetbridge"
GRADLE_TASK=":app:assembleMainlineRelease"
APK_SUBDIR="app/build/outputs/apk/mainline/release"
VERSION_FILE="app/build.gradle.kts"
SIGNING_STYLE="gadgetbridge"
APK_NAME_PREFIX="Gadgetbridge"

# Upstream leaves the release build unsigned (F-Droid signs it), so the queue
# carries a small build patch that takes the keystore from the environment
# instead of storing it in the tree. build-app.sh exports the variables.
# PATCHWORK_SIGN_KEYSTORE / PATCHWORK_SIGN_STORE_PASSWORD
# PATCHWORK_SIGN_KEY_ALIAS   / PATCHWORK_SIGN_KEY_PASSWORD

# CI only rebuilds this app when files under apps/gadgetbridge/ change.

# compileSdk 37 needs the preview platforms; the workflow installs
# platforms;android-37.0 and android-37.1 for every leg already.

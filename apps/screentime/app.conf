# Patchwork configuration for Screen Time.
# This file is sourced by the scripts in scripts/ — it is not executable.

APP_ID="screentime"
PROJECT_NAME="ScreenTime"
UPSTREAM_URL="https://gitlab.com/Atharok/ScreenTime.git"
UPSTREAM_BRANCH="main"
PACKAGE="com.atharok.screentime"
GRADLE_TASK=":app:assembleDefaultRelease"
APK_SUBDIR="app/build/outputs/apk/default/release"
VERSION_FILE="app/build.gradle.kts"
SIGNING_STYLE="screentime"
APK_NAME_PREFIX="ScreenTime"

# ARM only, for the same reason as expenses: the upstream APK carries
# prebuilt x86/x86_64 libs from its dependencies that this patchwork build does
# not need. build-app.sh strips them and re-signs the APK.
KEEP_ABIS="arm64-v8a armeabi-v7a"

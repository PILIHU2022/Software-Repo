# Patchwork configuration for BasicSync.
# This file is sourced by the scripts in scripts/ — it is not executable.
# CI re-anchors the patch queue on upstream moves; do not hand-edit upstream.txt.

APP_ID="basicsync"
PROJECT_NAME="BasicSync"
# Upstream default branch is master (not main).
UPSTREAM_URL="https://github.com/chenxiaolong/BasicSync.git"
UPSTREAM_BRANCH="master"
PACKAGE="com.chiller3.basicsync"
GRADLE_TASK=":app:assembleRelease"
APK_SUBDIR="app/build/outputs/apk/release"
# BasicSync computes versionCode/versionName from `git describe`, which packs
# the commit count into 5 bits and the ABI into 3. build-app.sh's
# VERSION_STYLE=pinned branch reads the newest upstream tag and exports
# PATCHWORK_VERSION_CODE/NAME/ABI; the queue's version patch makes the Gradle
# build honor them and narrows the ABI splits to the one being built.
VERSION_STYLE="pinned"
VERSION_FILE="app/build.gradle.kts"
SIGNING_STYLE="basicsync"
APK_NAME_PREFIX="BasicSync"

# The APK bundles a full Go/Syncthing runtime per ABI (~40 MB), so every leg
# builds exactly one architecture instead of a 4-ABI set.
BUILD_ABI="arm64-v8a"

# external/go and external/syncthing (shallow checkouts of the two pinned
# submodules) are compiled by Gradle via gomobile. They are never patched.
SUBMODULES="recursive"

# Consumed by the CI job; documented here so the requirements live with the app.
SDK_PACKAGES="ndk;30.0.16248370"

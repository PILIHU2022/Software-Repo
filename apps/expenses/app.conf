# Patchwork configuration for Recurring Expense Tracker.
# This file is sourced by the scripts in scripts/ — it is not executable.

APP_ID="expenses"
PROJECT_NAME="RecurringExpenseTracker"
UPSTREAM_URL="https://github.com/DennisBauer/RecurringExpenseTracker.git"
UPSTREAM_BRANCH="main"
PACKAGE="de.dbauer.expensetracker"
GRADLE_TASK=":app:assembleRelease"
APK_SUBDIR="app/build/outputs/apk/release"
VERSION_FILE="app/build.gradle.kts"
SIGNING_STYLE="expenses"
APK_NAME_PREFIX="RecurringExpenseTracker"

# CI only rebuilds this app when files under apps/expenses/ change.

# ARM only. The app has no native code of its own, but its AARs package
# prebuilt libs for four ABIs; build-app.sh strips lib/x86/ and lib/x86_64/,
# then realigns and re-signs the APK. x86 phones and emulators are no longer
# supported, and the APK shrinks by the x86 libs.
KEEP_ABIS="arm64-v8a armeabi-v7a"

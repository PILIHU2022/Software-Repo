# Patchwork configuration for Fcitx5 for Android.
# This file is sourced by the scripts in scripts/ — it is not executable.

APP_ID="fcitx5"
PROJECT_NAME="fcitx5-android"
# The upstream default branch is master (not main); check with
# `git ls-remote --symref <url> HEAD`.
UPSTREAM_URL="https://github.com/fcitx5-android/fcitx5-android.git"
UPSTREAM_BRANCH="master"
PACKAGE="org.fcitx.fcitx5.android"
GRADLE_TASK=":app:assembleRelease"
APK_SUBDIR="app/build/outputs/apk/release"
VERSION_FILE="build-logic/convention/src/main/kotlin/Versions.kt"
SIGNING_STYLE="fcitx5"
APK_NAME_PREFIX="Fcitx5ForAndroid"

# fcitx5-android computes versionCode/versionName in build-logic, so there is
# no Gradle file to rewrite: build-app.sh parses Versions.kt and exports
# PATCHWORK_REVISION + BUILD_VERSION_NAME instead (see scripts/build-app.sh).
VERSION_STYLE="build-logic"
# Per-ABI split APKs and no universal APK: one ABI per build.
BUILD_ABI="arm64-v8a"
APK_NAME_SUFFIX="arm64-v8a"
# 19 submodules (incl. the 364 MB shallow `prebuilt`) are compiled from source.
SUBMODULES="recursive"

# Consumed by the CI job; documented here so the requirements live with the app.
SYSTEM_PACKAGES="extra-cmake-modules gettext"
SDK_PACKAGES="platform-tools platforms;android-36 build-tools;36.1.0 cmake;3.31.6 ndk;28.0.13004108"

# CI only rebuilds this app when files under apps/fcitx5/ change.

# Patchwork configuration for the Bitwarden clients monorepository.
# This file is sourced by scripts/build-bitwarden.sh — it is not executable.
#
# Bitwarden ships one upstream tree for the browser extensions and the
# Electron desktop client. It is not an Android app, so it lives under
# desktop/ and never enters the F-Droid repository.

APP_ID="bitwarden"
PROJECT_NAME="Bitwarden"
KIND="electron"
UPSTREAM_URL="https://github.com/bitwarden/clients.git"
UPSTREAM_BRANCH="main"

# The security check and the Linux Wayland switch are applied to this queue.
# Browser builds produce Chrome/Edge and Firefox packages; desktop builds are
# packaged natively on the matching GitHub-hosted runner.
BROWSER_TARGETS="chrome firefox edge"
DESKTOP_TARGETS="linux windows macos"

# Node 22 is supported by the upstream build and by Electron 39.
NODE_VERSION="22"

# Last successfully built upstream commit. Used by the workflow gate and as
# the fallback when the queue no longer applies to the new upstream head.
STATE_FILE="desktop/.build-state.json"


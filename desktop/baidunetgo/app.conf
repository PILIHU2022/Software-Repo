# Patchwork configuration for BaiduNetGo, the desktop Baidu Netdisk client.
# This file is sourced by scripts/build-baidunetgo.sh — it is not executable.
#
# BaiduNetGo is a pure-Go/MyGo desktop app, not an Android app: its artifacts
# are workflow artifacts, never F-Droid packages, and it lives under desktop/
# rather than apps/ (apps/*/app.conf is consumed by build.yml and the APK
# builders). The queue under desktop/baidunetgo/patches is authored in the
# ../baidunetgo clone and reapplied to every new upstream head.

APP_ID="baidunetgo"
PROJECT_NAME="BaiduNetGo"
KIND="go-desktop"
UPSTREAM_URL="https://github.com/pengstem/baidunetgo.git"
UPSTREAM_BRANCH="main"

# x86 only. MyGo needs no cgo, so linux/amd64 and windows/amd64 are both
# cross-built on the x86 ubuntu runner (the Windows installer needs NSIS).
BUILD_PLATFORMS="linux/amd64,windows/amd64"

# The last upstream commit that was successfully built, kept by the workflow's
# state job. Used both to detect a new upstream head and as the fallback
# commit when the queue no longer applies to the head.
STATE_FILE="desktop/.build-state.json"